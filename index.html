<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/yr/r/rzWiSjZRxk5.webp" sizes="192x192">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="left-section">

            <img src="images/instalogo.png" alt="refresh" class="logo">
            <div class="heading">
                <h1 id="h1">See everyday moments from 
                    <br>your <span class="notes">close friends</span>.</h1>
            </div>
            <div>
                <img src="images/img.webp" alt="" class="img">
            </div>
            <hr class="horizontal-line">
        </div>
        <div class="vertical-line"></div>
            <div class="right-section">
                <p class="login-info">Log into Instagram</p>
                <form>
                    <div class="input-fields">
                        <div class="full-width">
                            <input type="text" placeholder="Mobile number,Username or email" >
                        </div>
                        <div class="full-width">
                            <input type="text" placeholder="Password" >
                        </div>
                    </div>
                    
                    <div class="button-div">
                        <button class="login-btn">Log in</button>
                    </div>
                    <div class="button-div">
                        <button class="fgp-btn">Forgot password?</button>
                    </div>
                    <div class="button-div">
                        <button class="facebook-btn">ⓕ Log in with Facebook</button>
                    </div>
                    <div class="button-div">
                        <button class="acc-btn">Create new account</button>
                    </div>
                    <div class="button-div">
                        <button class="meta-btn"> Ⓜ️ Meta</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="call-todo-action sam">
            <a href="https://www.meta.com/en-gb/about/?utm_source=about.meta.com&utm_medium=redirect">Meta</a>
            <a href="https://about.instagram.com/">About</a>
            <a href="https://about.instagram.com/blog/">Blog</a>
            <a href="https://about.instagram.com/about-us/careers">Jobs</a>
            <a href="https://help.instagram.com/">Help</a>
            <a href="https://developers.facebook.com/docs/instagram-platform">API</a>
            <a href="https://privacycenter.instagram.com/policy/?entry_point=ig_help_center_data_policy_redirect">Privacy</a>
            <a href="https://help.instagram.com/581066165581870/">Terms</a>
            <a href="https://www.instagram.com/explore/locations/">Locations</a>
            <a href="https://www.instagram.com/popular/">Popular</a>
            <a href="https://www.instagram.com/web/lite/">Insatgram Lite</a>
            <a href="https://www.meta.ai/?utm_source=foa_web_footer">Meta AI</a>
            <a href="https://www.threads.com/">Threads</a>
            <a href="https://www.facebook.com/help/instagram/261704639352628">Contact Uploading & Non-User</a>
            <a href="https://www.instagram.com/accounts/meta_verified/?entrypoint=web_footer">Meta Verified</a>
        </div>
        <div class="language">
            <select class="nxt">
                <option value="English">English</option>
                <option value="Tamil Nadu">Tamil</option>
                <span>© 2026 Meta</span>
            </select>
            
        </div>
    </div>
</body>
</html>
